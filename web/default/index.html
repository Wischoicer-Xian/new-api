<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <script>
      // The static <base href="/"> above is correct for the Go server root and —
      // crucially — because it is static, the browser's preload scanner sees it.
      // That stops the scanner from speculatively fetching /dashboard/static/...
      // on a client-route deep link (e.g. /dashboard/models) and getting index.html
      // back: it fetches /static/... like the main parser, so the two dedupe instead
      // of producing duplicate text/html requests. For the /token-platform* proxy
      // deployments, switch <base> to the proxy prefix before the asset tags below
      // parse. Detection mirrors src/lib/basepath.ts. See WIS-518.
      (function () {
        var p = window.location.pathname;
        var base = '/';
        if (p.indexOf('/token-platform-fe') === 0) base = '/token-platform-fe/';
        else if (p.indexOf('/token-platform') === 0) base = '/token-platform/';
        if (base !== '/') {
          var b = document.querySelector('base');
          if (b) b.href = base;
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
