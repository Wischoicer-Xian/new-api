# OpenCodeReview - PR 自动 AI 审查
# 触发：PR 打开/更新/重开；评论 /open-code-review 手动重审
# 需要的 org/repo 配置：
#   secret   OCR_LLM_URL / OCR_LLM_AUTH_TOKEN
#   variable OCR_LLM_MODEL / OCR_LLM_USE_ANTHROPIC
name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # 用 pull_request_target 使 fork PR 也能读到 secrets；action 只读 diff
  # 不执行 PR 内代码，安全。
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      # 主备模型（8/7 排障实证：luna 从网关下线 → provider 0 token 全挂；非 OCR 版本问题）：
      # 主 = vars.OCR_LLM_MODEL（luna，max 思考）；主失败 → 备 = gpt-5.6-sol（medium）。
      # luna 恢复后删备步骤并去掉主的 continue-on-error 即可。
      - name: Run OpenCodeReview (primary)
        id: ocr-primary
        uses: alibaba/open-code-review@main
        continue-on-error: true  # 主模型失败不挂 job，走 fallback
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # max 思考（网关实测接受 reasoning_effort=max；action 默认 thinking=disabled）
          llm_extra_body: '{"reasoning_effort": "max"}'

          language: '中文'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Run OpenCodeReview (fallback sol/medium)
        if: steps.ocr-primary.outcome == 'failure'
        uses: alibaba/open-code-review@main
        with:
          # 备步骤禁 artifact 上传：主备同名 ocr-review-result-{run}-1 撞 409（实测把成功审查判成 job 红）
          upload_artifacts: false
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: 'gpt-5.6-sol'
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # 备模型用 medium（max 在 sol 上未实证）
          llm_extra_body: '{"reasoning_effort": "medium"}'

          language: '中文'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
