name: integration

# MySQL integration gate for the wischoicer billing feature (R9 P1-3).
#
# The wischoicer capacity/credit/Epay invariants (reserve/release/credit
# idempotency, per-user quota row lock, Epay atomic credit, int32 hard-cap
# rollback) are exercised on in-memory SQLite by the default `go test ./...`
# suite. SQLite serializes on a single write lock and has no FOR UPDATE, so it
# cannot prove the row-lock / unique-index / int-column semantics that MySQL
# enforces. This workflow lifts those scenarios onto a real mysql:8.0 via
# testcontainers-go.
#
# Fail-closed: the integration-tagged helpers call t.Fatalf (not t.Skipf) when
# Docker or the container is unavailable, so a green run here proves the MySQL
# path actually ran. Do not add -short or skip flags.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go module download
        run: go mod download

      - name: Build (integration tag)
        run: go build -tags integration ./...

      - name: Vet (integration tag)
        run: go vet -tags integration ./...

      # Fail-closed gate: the integration tag MUST run the MySQL testcontainer
      # suite. setupWischoicerMySQLDB calls t.Fatalf (not t.Skipf) when Docker
      # or the container is unavailable, so a green run proves FOR UPDATE, unique
      # indexes, CAS and int32 column semantics hold on real MySQL rather than
      # being skipped silently.
      - name: MySQL integration tests
        run: go test -tags integration -count=1 ./model/...

      # Also run the default SQLite suite to catch regressions in the
      # non-integration path.
      - name: Unit tests (SQLite)
        run: go test -count=1 ./...
